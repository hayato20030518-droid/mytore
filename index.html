<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E7568">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイトレ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>マイトレ</title>
<style>
  /* ================= tokens ================= */
  :root{
    --bg:#F4F6F5; --surface:#FFFFFF; --surface2:#ECF1EF; --ink:#1B2A28; --muted:#5D6E6B;
    --line:#DCE4E1; --accent:#0E7568; --accent-ink:#FFFFFF; --accent-soft:#E1F0ED;
    --warn:#A85E10; --warn-soft:#F7EDDC; --danger:#B3352C; --danger-soft:#F8E7E5;
    --ok:#2E7D4F; --ok-soft:#E3F1E8; --radius:14px; --shadow:0 1px 2px rgba(27,42,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1514; --surface:#161E1C; --surface2:#1D2725; --ink:#E4ECEA; --muted:#8FA39F;
      --line:#263230; --accent:#3BB8A5; --accent-ink:#06231F; --accent-soft:#123029;
      --warn:#E0A458; --warn-soft:#2E2410; --danger:#E27D74; --danger-soft:#33201E;
      --ok:#66C08D; --ok-soft:#172B20; --shadow:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F6F5; --surface:#FFFFFF; --surface2:#ECF1EF; --ink:#1B2A28; --muted:#5D6E6B;
    --line:#DCE4E1; --accent:#0E7568; --accent-ink:#FFFFFF; --accent-soft:#E1F0ED;
    --warn:#A85E10; --warn-soft:#F7EDDC; --danger:#B3352C; --danger-soft:#F8E7E5;
    --ok:#2E7D4F; --ok-soft:#E3F1E8; --shadow:0 1px 2px rgba(27,42,40,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0F1514; --surface:#161E1C; --surface2:#1D2725; --ink:#E4ECEA; --muted:#8FA39F;
    --line:#263230; --accent:#3BB8A5; --accent-ink:#06231F; --accent-soft:#123029;
    --warn:#E0A458; --warn-soft:#2E2410; --danger:#E27D74; --danger-soft:#33201E;
    --ok:#66C08D; --ok-soft:#172B20; --shadow:none;
  }

  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;
    line-height:1.55; margin:0; font-size:15px;
  }
  *{ box-sizing:border-box; }
  button{ font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  input,select{ font:inherit; color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }

  .num{ font-variant-numeric:tabular-nums; font-weight:700; }
  .muted{ color:var(--muted); }
  .small{ font-size:12px; }

  /* ================= shell ================= */
  #shell{ max-width:480px; margin:0 auto; min-height:100dvh; background:var(--bg); position:relative; }
  @media (min-width:520px){ #shell{ border-left:1px solid var(--line); border-right:1px solid var(--line); } }

  header.app{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px 10px; border-bottom:1px solid var(--line);
  }
  .wordmark{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; letter-spacing:.02em; }
  .wordmark svg{ display:block; }
  .hbtn{ font-size:13px; font-weight:600; color:var(--muted); padding:6px 10px; border-radius:8px; }
  .hbtn:hover{ background:var(--surface2); }
  .hbtn.active{ color:var(--accent); }

  main{ padding:14px 14px 96px; }

  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:30;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 8px; color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.04em; position:relative; }
  .tab svg{ display:block; }
  .tab.active{ color:var(--accent); }
  .tab.active::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--accent); }

  /* ================= components ================= */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card h2{ font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:700; letter-spacing:.06em; }
  .card h2 .h-extra{ float:right; font-weight:600; letter-spacing:0; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; font-weight:700; padding:11px 16px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:active{ filter:brightness(.94); }
  .btn-ghost{ background:var(--surface2); color:var(--ink); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:8px; }
  .btn[disabled]{ opacity:.5; cursor:default; }

  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--surface2); color:var(--muted); }
  .chip.ok{ background:var(--ok-soft); color:var(--ok); }
  .chip.warn{ background:var(--warn-soft); color:var(--warn); }
  .chip.danger{ background:var(--danger-soft); color:var(--danger); }
  .chip.accent{ background:var(--accent-soft); color:var(--accent); }

  .note{ font-size:12px; color:var(--muted); }
  .callout{ border-radius:10px; padding:9px 12px; font-size:12.5px; margin-top:8px; }
  .callout.warn{ background:var(--warn-soft); color:var(--warn); }
  .callout.danger{ background:var(--danger-soft); color:var(--danger); }
  .callout.accent{ background:var(--accent-soft); color:var(--accent); }

  .row{ display:flex; align-items:center; gap:8px; }
  .row.between{ justify-content:space-between; }
  .stack{ display:flex; flex-direction:column; gap:8px; }

  .stat{ display:flex; flex-direction:column; gap:1px; }
  .stat .v{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; }
  .stat .l{ font-size:11px; color:var(--muted); font-weight:600; }

  .bar{ height:8px; border-radius:99px; background:var(--surface2); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent); }
  .bar.done > i{ background:var(--ok); }

  .list{ display:flex; flex-direction:column; }
  .list-item{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--line); text-align:left; width:100%; }
  .list-item:first-child{ border-top:none; }
  .li-main{ flex:1; min-width:0; }
  .li-title{ font-weight:700; font-size:14px; }
  .li-sub{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  input[type="number"], input[type="date"], input[type="text"], select{
    background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; width:100%; font-variant-numeric:tabular-nums;
    font-size:16px; /* iOS Safariはfont-size<16pxの入力欄でフォーカス時に自動ズームするため */
  }
  input[type="date"]{ min-height:40px; }
  label.field{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }

  /* stepper */
  .stepper{ display:grid; grid-template-columns:44px 1fr 44px; gap:6px; align-items:stretch; }
  .st-btn{ background:var(--surface2); border:1px solid var(--line); border-radius:10px; font-size:19px; font-weight:700; color:var(--accent); min-height:44px; }
  .st-btn:active{ background:var(--accent-soft); }
  .stepper input{ text-align:center; font-weight:700; font-size:17px; }

  /* RPE */
  .rpe-row{ display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
  .rpe-cell{ min-height:38px; border-radius:8px; background:var(--surface2); border:1px solid var(--line); font-weight:700; font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--muted); }
  .rpe-cell.sel-ok{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok); }
  .rpe-cell.sel-warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
  .rpe-cell.sel-danger{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }

  /* segmented */
  .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--surface2); border-radius:10px; padding:3px; gap:3px; margin-bottom:12px; }
  .seg button{ padding:7px 4px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  /* calendar */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title{ font-weight:800; font-size:15px; }
  .cal-nav{ width:36px; height:36px; border-radius:8px; background:var(--surface2); font-size:16px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow{ text-align:center; font-size:10.5px; color:var(--muted); font-weight:700; padding:3px 0; }
  .cal-cell{ aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; font-variant-numeric:tabular-nums; position:relative; }
  .cal-cell.day{ background:var(--surface2); }
  .cal-cell.day:active{ background:var(--accent-soft); }
  .cal-cell.today{ outline:1.5px solid var(--accent); outline-offset:-1.5px; }
  .cal-cell.sel{ background:var(--accent); color:var(--accent-ink); }
  .cal-dots{ display:flex; gap:3px; height:5px; }
  .dot{ width:5px; height:5px; border-radius:99px; }
  .dot.w{ background:var(--accent); } .cal-cell.sel .dot.w{ background:var(--accent-ink); }
  .dot.bw{ background:var(--warn); } .cal-cell.sel .dot.bw{ background:var(--accent-ink); opacity:.6; }

  /* picker / sheet */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(10,18,17,.5); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--surface); width:100%; max-width:480px; border-radius:18px 18px 0 0; max-height:88dvh; overflow-y:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0)); animation:up .18s ease-out; }
  @keyframes up{ from{ transform:translateY(24px); opacity:.6; } to{ transform:none; opacity:1; } }
  .sheet h3{ margin:0 0 4px; font-size:17px; }
  .sheet .sub{ font-size:12px; color:var(--muted); margin-bottom:12px; }
  .grab{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 12px; }
  .modal-center{ align-items:center; padding:20px; }
  .modal-box{ background:var(--surface); border-radius:16px; width:100%; max-width:400px; padding:18px; }

  .pick-item{ display:flex; align-items:center; gap:10px; width:100%; padding:12px 4px; border-top:1px solid var(--line); text-align:left; }
  .pick-list .pick-item:first-child{ border-top:none; }
  .pick-name{ flex:1; font-weight:700; font-size:14.5px; }
  .pick-last{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  /* 部位選択グリッド */
  .part-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .part-cell{ background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:13px 6px 11px; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .part-cell:active{ background:var(--accent-soft); }
  .part-cell b{ font-size:15.5px; }

  /* toast */
  #toast{ position:fixed; bottom:86px; left:50%; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:9px 16px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%; text-align:center; }
  #toast.show{ opacity:1; }

  .banner{ background:var(--warn-soft); color:var(--warn); font-size:12px; padding:8px 14px; }

  .kv{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13.5px; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }

  .pfc{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .pfc .cell{ background:var(--surface2); border-radius:10px; padding:10px 8px; text-align:center; }
  .pfc .cell b{ display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .pfc .cell span{ font-size:11px; color:var(--muted); font-weight:700; }

  .sugg-badge{ font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:7px; }
  .sugg-up{ background:var(--accent-soft); color:var(--accent); }
  .sugg-reps{ background:var(--ok-soft); color:var(--ok); }
  .sugg-keep{ background:var(--surface2); color:var(--muted); }
  .sugg-down{ background:var(--warn-soft); color:var(--warn); }
  .sugg-first{ background:var(--surface2); color:var(--muted); }

  /* 4週間チャレンジ */
  .cw-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:4px; }
  .cw{ border-radius:10px; padding:8px 4px; text-align:center; background:var(--surface2); }
  .cw span{ display:block; font-size:10.5px; color:var(--muted); font-weight:700; }
  .cw b{ font-size:14px; font-variant-numeric:tabular-nums; }
  .cw.done{ background:var(--ok-soft); } .cw.done span,.cw.done b{ color:var(--ok); }
  .cw.cur{ background:var(--accent-soft); } .cw.cur span,.cw.cur b{ color:var(--accent); }
  .cw.fut{ opacity:.55; }

  .chart-wrap{ overflow-x:auto; }
  .chart-wrap svg{ display:block; width:100%; height:auto; }

  /* からだマップ(前面/背面の筋肉ハイライト) */
  .bm-row{ display:flex; gap:10px; }
  .bm{ flex:1; min-width:0; }
  .bm svg{ display:block; width:100%; height:auto; border-radius:14px; }
  .bm-legend{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:11px; color:var(--muted); }
  .bm-legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid var(--line); }

  footer.app{ padding:6px 18px 24px; font-size:11px; color:var(--muted); text-align:center; }
</style>

<div id="shell">
  <div id="storage-banner" class="banner" hidden>⚠️ この環境ではブラウザ保存が使えません。タブを閉じるとデータが消えます。設定 → エクスポートでバックアップしてください。</div>
  <header class="app">
    <div class="wordmark">
      <img id="app-logo" alt="" style="width:24px;height:24px;border-radius:6px;display:block">
      マイトレ
    </div>
    <button class="hbtn" id="settings-btn" data-action="nav" data-view="settings">設定</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   マイトレ v1.0 — トレーニング記録アプリ(企画書v1準拠)
   Vanilla JS 単一ファイル / localStorage 永続化
   ============================================================ */

/* ---------------- storage ---------------- */
const store = (() => {
  const PREFIX = "mytore:";
  const mem = {}; /* localStorageへ書けない場合の受け皿。読み取りは常に両方を参照する */
  let persistent = true;
  let lostCb = null;
  try {
    localStorage.setItem(PREFIX + "__t", "1");
    localStorage.removeItem(PREFIX + "__t");
  } catch (e) { persistent = false; }
  const lsGet = k => { try { return localStorage.getItem(PREFIX + k); } catch (e) { return null; } };
  return {
    get(k) {
      const raw = (k in mem) ? mem[k] : lsGet(k);
      try { return raw == null ? null : JSON.parse(raw); } catch (e) { return null; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      if (persistent) {
        try { localStorage.setItem(PREFIX + k, s); return; }
        catch (e) { persistent = false; if (lostCb) lostCb(); }
      }
      mem[k] = s;
    },
    del(k) {
      try { localStorage.removeItem(PREFIX + k); } catch (e) {}
      delete mem[k];
    },
    keys() {
      const out = new Set(Object.keys(mem));
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX)) out.add(k.slice(PREFIX.length));
        }
      } catch (e) {}
      return [...out];
    },
    isPersistent: () => persistent,
    onLost(cb) { lostCb = cb; },
  };
})();

/* ---------------- 同梱初期データ(オーナーのエクスポートを内蔵) ----------------
   データが空の端末で開いたとき、一度だけ読み込む。
   既にデータがある端末は上書きしない。全データ削除後(seed-doneあり)は再投入しない */
const SEED_DATA = null; /* 公開版は同梱データなし(設定→インポートで復元) */
if (SEED_DATA && store.get("settings") == null && !store.get("seed-done")) {
  Object.keys(SEED_DATA).forEach(k => store.set(k, SEED_DATA[k]));
  store.set("seed-done", true);
}

/* ---------------- date utils ---------------- */
const pad2 = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const DOW = ["月", "火", "水", "木", "金", "土", "日"];
const dowJp = s => DOW[(parseD(s).getDay() + 6) % 7];
const fmtMD = s => { const d = parseD(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
function weekStartOf(s) { const d = parseD(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return dstr(d); }
function daysAgoLabel(s) {
  const n = daysBetween(s, today());
  if (n <= 0) return "今日";
  if (n === 1) return "昨日";
  return n + "日前";
}

/* ---------------- exercise master ---------------- */
const DEFAULT_MASTER = [
  { id: "chest-press",    name: "チェストプレス",         part: "胸",   type: "s", unit: 5, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "lat-pulldown",   name: "ラットプルダウン",       part: "背中", type: "s", unit: 5, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "seated-row",     name: "シーテッドロー",         part: "背中", type: "s", unit: 5, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "shoulder-press", name: "マシンショルダープレス", part: "肩",   type: "s", unit: 5, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "leg-press",      name: "レッグプレス",           part: "脚",   type: "s", unit: 5, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "leg-curl",       name: "レッグカール",           part: "脚",   type: "s", unit: 5, lo: 12, hi: 15, sets: 2, repUnit: "回", fav: true,  note: "ピン1段階ずつ" },
  { id: "abdominal",      name: "アブドミナル",           part: "体幹", type: "s", unit: 5, lo: 12, hi: 15, sets: 2, repUnit: "回", fav: true,  note: "" },
  { id: "plank",          name: "プランク",               part: "体幹", type: "s", unit: 0, lo: 30, hi: 60, sets: 2, repUnit: "秒", fav: false, note: "" },
  /* --- 追加マシン種目(v1.4) --- */

{

/* ---------------- workout data ---------------- */
function getWorkout(date) { return store.get("workout:" + date); }
function setWorkout(date, w) {
  if (!w || ((w.exercises || []).length === 0 && (w.cardio || []).length === 0)) {
    store.del("workout:" + date);
  } else {
    w.kcal = dayKcal(date, w);

  }
}
function workoutDates() {
  return store.keys().filter(k => k.startsWith("workout:")).map(k => k.slice(8)).sort();

function getWeightLog() { return store.get("weight-log") || {}; }

/* 最新の記録体重(date以前)→ 無ければ設定の体重 */
function bodyWeightAt(date) {
  const log = getWeightLog();
  const ds = Object.keys(log).filter(d => d <= date).sort();
  if (ds.length) return log[ds[ds.length - 1]].kg;
  const all = Object.keys(log).sort();
  if (all.length) return log[all[0]].kg;
  return settings ? settings.weight : 60;
}

/* ---------------- kcal (METs方式) ----------------
   kcal ≒ METs × 体重(kg) × 時間(h) × 1.05
   筋トレ時間: セット数 × 約3分(休憩込み)で推定
   筋トレMETs: RPE8以上 → 6.0(高強度) / それ以外 → 3.5(軽〜中) */
const MIN_PER_SET = 3;
function strengthKcal(e, bw) {
  const mets = (e.rpe >= 8) ? 6.0 : 3.5;
  const minutes = (e.sets || 1) * MIN_PER_SET;
  return mets * bw * (minutes / 60) * 1.05;
}
function cardioKcal(c, bw) {
  const m = mById(c.id);
  let mets = c.mets || (m && m.mets) || 5.0;
  if (c.incline > 0) {
    /* 傾斜補正: ACSM歩行式/走行式の勾配項の近似(歩行 +0.5METs/% / 走行 +0.35METs/%) */
    const perPct = c.id === "walk" ? 0.5 : 0.35;
    mets += Math.min(15, c.incline) * perPct;
  }
  return mets * bw * ((c.minutes || 0) / 60) * 1.05;
}
function dayKcal(date, w) {
  const bw = bodyWeightAt(date);
  let k = 0;
  (w.exercises || []).forEach(e => { k += strengthKcal(e, bw); });
  (w.cardio || []).forEach(c => { k += cardioKcal(c, bw); });
  return Math.round(k);
}

/* ---------------- history helpers ---------------- */
function exHistory(id, limit = 60) {
  const out = [];
  const dates = workoutDates().reverse();
  for (const d of dates) {
    const w = getWorkout(d);
    if (!w) continue;
    for (const e of (w.exercises || [])) {
      if (e.id === id) { out.push({ date: d, e }); break; }
    }
    if (out.length >= limit) break;
  }
  return out; // 新しい順
}
function lastWorkoutDate() {
  const ds = workoutDates();
  return ds.length ? ds[ds.length - 1] : null;
}
function partLastTrained() {
  const map = {};
  for (const d of workoutDates()) {
    const w = getWorkout(d);
    (w.exercises || []).forEach(e => {
      if (!map[e.part] || map[e.part] < d) map[e.part] = d;
    });
  }
  return map;
}
function firstWorkoutDate() {
  const ds = workoutDates();
  return ds.length ? ds[0] : null;
}
function isBeginner() {
  const mode = settings && settings.beginner || "auto";
  if (mode === "on") return true;
  if (mode === "off") return false;
  const f = firstWorkoutDate();
  return !f || daysBetween(f, today()) < 56; // 最初の約8週
}
/* 4週間チャレンジ(企画書の成功指標): 初回記録日から28日間、
   1週間ブロックごとに「週の目標回数(settings.daysPerWeek)以上記録」で達成 */
function challengeInfo() {
  const start = firstWorkoutDate();
  if (!start || !settings) return null;
  /* 開始時点の週目標をスナップショット(後から設定を変えても過去週の達成判定が変わらないように) */
  if (!settings.challenge || settings.challenge.start !== start) {
    settings.challenge = { start, target: settings.daysPerWeek || 2 };
    saveSettings();
  }
  const day = daysBetween(start, today()) + 1; /* 初回記録日 = Day 1 */
  const target = settings.challenge.target;
  const dates = workoutDates();
  const weeks = [];
  for (let i = 0; i < 4; i++) {
    const from = addDays(start, i * 7), to = addDays(start, i * 7 + 6);
    const count = dates.filter(d => d >= from && d <= to).length;
    weeks.push({ from, to, count,
      done: count >= target,
      current: today() >= from && today() <= to,
      future: today() < from });
  }
  return { start, day, target, weeks, ended: day > 28 };
}
function weekStats(refDate) {
  const ws = weekStartOf(refDate || today());
  let strengthDays = 0, cardioMin = 0, kcal = 0, workoutDays = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const w = getWorkout(d);
    if (!w) continue;
    workoutDays.push(d);
    if ((w.exercises || []).length) strengthDays++;
    (w.cardio || []).forEach(c => { cardioMin += (c.minutes || 0); });
    kcal += dayKcal(d, w);
  }
  return { weekStart: ws, strengthDays, cardioMin, kcal, workoutDays };
}

/* ---------------- 次の挑戦ロジック(漸進性過負荷) ---------------- */
function roundToStep(v, step) {
  if (!step) return Math.round(v * 10) / 10;
  return Math.max(0, Math.round(v / step) * step);
}
function stepFor(m) {
  if (m.unit != null && m.unit > 0) return m.unit;
  if (m.unit === 0) return 0;
  return ["胸", "背中", "肩", "腕"].includes(m.part) ? 2.5 : 5; // 上半身+2.5 / 下半身+5
}
function suggestFor(id) {
  const m = mById(id);
  if (!m || m.type !== "s") return null;
  const hist = exHistory(id, 5);
  const ru = m.repUnit || "回";
  if (!hist.length) {
    return { m, type: "first", badge: "はじめて", cls: "sugg-first",
      title: m.lo + "〜" + m.hi + ru + "でギリギリできる負荷から",
      detail: "RPE 7前後(あと2〜3" + ru + "できる余力)が目安。まずはフォームを最優先に。" };
  }
  const last = hist[0].e, prev = hist[1] && hist[1].e;
  const lastLabel = fmtSet(last, m);
  const bigMiss = ru === "秒" ? last.reps < m.lo * 0.7 : last.reps <= m.lo - 3;
  const rpeStreak = last.rpe >= 9 && prev && prev.rpe >= 9;
  const step = stepFor(m);

  /* 大幅未達、または RPE9〜10 が継続 → 重量を5〜10%下げてフォーム優先 */
  if ((bigMiss || rpeStreak) && step > 0 && last.weight > step) {
    let w90 = roundToStep(last.weight * 0.9, step);
    let w95 = roundToStep(last.weight * 0.95, step);
    w95 = Math.min(w95, last.weight - step); /* 丸めで現重量と同じ提案になるのを防ぐ */
    if (w90 > w95) w90 = w95;
    const range = w90 === w95 ? w90 + "kg" : w90 + "〜" + w95 + "kg";
    return { m, type: "down", badge: "軽くする", cls: "sugg-down", last: lastLabel, lastDate: hist[0].date,
      title: "重量を5〜10%下げる → " + range,
      detail: (rpeStreak ? "RPE 9〜10が続いています。" : "前回は大幅未達でした。") + "一度軽くしてフォームと回数の安定を優先しましょう。" };
  }
  if (bigMiss || rpeStreak) {
    return { m, type: "down", badge: "負荷を下げる", cls: "sugg-down", last: lastLabel, lastDate: hist[0].date,
      title: "負荷を下げてフォーム優先",
      detail: "キツさが続いています。回数(時間)を1〜2割減らして立て直しましょう。" };
  }
  /* 一部未達 → 同じ重量で回数の積み上げ */
  if (last.reps < m.lo) {
    return { m, type: "reps", badge: "回数を積む", cls: "sugg-reps", last: lastLabel, lastDate: hist[0].date,
      title: "同じ負荷で " + m.lo + ru + " を目指す",
      detail: "重量はそのまま。まず目標回数(" + m.lo + "〜" + m.hi + ru + ")の達成を狙いましょう。" };
  }
  /* 目標上限に到達 + RPE8以下 → 重量アップ(または回数+1) */
  if (last.reps >= m.hi && last.rpe <= 8) {
    const beginnerHold = isBeginner() && !(prev && prev.reps >= m.hi && prev.rpe <= 8);
    if (beginnerHold) {
      return { m, type: "keep", badge: "もう1回安定", cls: "sugg-keep", last: lastLabel, lastDate: hist[0].date,
        title: "同条件でもう1回、余裕をつくる",
        detail: "初心者期はフォーム優先。同じ条件を2回続けて達成できたら次回アップを提案します。" };
    }
    if (step > 0 && last.weight > 0) {
      const nw = last.weight + step;
      return { m, type: "up", badge: "重量アップ", cls: "sugg-up", last: lastLabel, lastDate: hist[0].date,
        title: nw + "kg × " + m.lo + ru + " × " + last.sets + "セット",
        detail: "+" + step + "kg" + (m.note ? "(" + m.note + ")" : "") + "。または同じ重量で回数+1でもOK。上げた直後は回数が落ちて正常です。" };
    }
    /* 自重系(プランク等) */
    return { m, type: "up", badge: "時間/回数UP", cls: "sugg-up", last: lastLabel, lastDate: hist[0].date,
      title: (last.reps + (ru === "秒" ? 5 : 1)) + "〜" + (last.reps + (ru === "秒" ? 10 : 2)) + ru + "に挑戦",
      detail: "余力があります。少しずつ伸ばしましょう。" };
  }
  /* 目標上限に到達したが RPE9以上(単発)またはRPE未記録 → 維持 */
  if (last.reps >= m.hi) {
    return { m, type: "keep", badge: "維持", cls: "sugg-keep", last: lastLabel, lastDate: hist[0].date,
      title: "同条件で余裕をつくる",
      detail: last.rpe == null
        ? "回数は達成。RPE(キツさ)が未記録です。次回はRPEも記録すると、より正確な提案ができます。"
        : "回数は達成していますがキツさが高め(RPE " + last.rpe + ")。RPE 8以下でこなせたら次回アップ。" };
  }
  /* 目標範囲内だがキツさが高い(RPE9〜10) → 維持 */
  if (last.rpe >= 9) {
    return { m, type: "keep", badge: "維持", cls: "sugg-keep", last: lastLabel, lastDate: hist[0].date,
      title: "同じ負荷で余裕をつくる",
      detail: "キツさが高め(RPE " + last.rpe + ")。RPE 8以下でこなせるようになったら回数+1を狙いましょう。" };
  }
  /* 目標範囲内 → 回数+1 */
  return { m, type: "reps", badge: "回数 +1", cls: "sugg-reps", last: lastLabel, lastDate: hist[0].date,
    title: "同じ負荷で " + Math.min(last.reps + 1, m.hi) + ru + " に挑戦",
    detail: "目標範囲(" + m.lo + "〜" + m.hi + ru + ")内です。上限までは回数で伸ばしましょう。" };
}
function fmtSet(e, m) {
  const ru = (m && m.repUnit) || "回";
  const rpe = e.rpe ? " / RPE " + e.rpe : "";
  const sd = e.setDetails;
  if (sd && sd.length) {
    const sameW = sd.every(x => x.w === sd[0].w);
    const sameR = sd.every(x => x.r === sd[0].r);
    if (sameW && sameR) return (sd[0].w > 0 ? sd[0].w + "kg × " : "") + sd[0].r + ru + " × " + sd.length + "セット" + rpe;
    if (sameW) return (sd[0].w > 0 ? sd[0].w + "kg × " : "") + sd.map(x => x.r).join("·") + ru + rpe;
    return sd.map(x => (x.w > 0 ? x.w + "kg×" : "") + x.r + ru).join(" / ") + rpe;
  }
  const w = (e.weight > 0 ? e.weight + "kg × " : "");
  return w + e.reps + ru + " × " + e.sets + "セット" + rpe;
}

function fmtCardio(c) {
  let out = c.minutes + "分";
  if (c.distance) out += " / " + c.distance + "km";
  if (c.incline > 0) out += " / 傾斜" + c.incline + "%";
  return out;
}

/* ---------------- おすすめトレーニング ---------------- */
function templatesFor(days) {
  if (days <= 2) return [
    { name: "A日(全身)", ids: ["chest-press", "lat-pulldown", "leg-press", "abdominal"] },
    { name: "B日(全身)", ids: ["shoulder-press", "seated-row", "leg-curl", "plank"] },
  ];
  return [
    { name: "押す日(胸・肩・腕の裏側)", ids: ["chest-press", "shoulder-press", "abdominal"] },
    { name: "引く日(背中・腕の表側)",   ids: ["lat-pulldown", "seated-row", "plank"] },
    { name: "脚の日",                     ids: ["leg-press", "leg-curl", "abdominal"] },
  ];
}
function recommendToday() {
  const days = settings ? settings.daysPerWeek : 2;
  const tpls = templatesFor(days);
  /* 直近の筋トレ日がどのテンプレに近いかで次を決める */
  let lastIdx = -1, lastDate = null;
  const dates = workoutDates().reverse();
  for (const d of dates) {
    const w = getWorkout(d);
    const ids = new Set((w.exercises || []).map(e => e.id));
    if (!ids.size) continue;
    let best = -1, bestScore = 0;
    tpls.forEach((t, i) => {
      const score = t.ids.filter(x => ids.has(x)).length;
      if (score > bestScore) { bestScore = score; best = i; }
    });
    if (best >= 0) { lastIdx = best; lastDate = d; }
    break;
  }
  const nextIdx = lastIdx < 0 ? 0 : (lastIdx + 1) % tpls.length;
  const tpl = tpls[nextIdx];
  /* 48〜72時間ルール: 直近48h以内に鍛えた部位への注意 */
  const plt = partLastTrained();
  const warns = [];
  const tplParts = [...new Set(tpl.ids.map(id => (mById(id) || {}).part).filter(Boolean))];
  tplParts.forEach(p => {
    if (plt[p] != null && RECOVERY_WARN_PARTS.includes(p)) {
      const dd = daysBetween(plt[p], today());
      if (dd === 0) warns.push(p + "は今日トレーニング済み — 回復のため明日以降を推奨");
      else if (dd === 1) warns.push(p + "は前回から約24時間 — 48〜72時間の回復を推奨");
    }
  });
  return { tpl, warns, lastDate, days };
}

  histSeg: "cal",
  histMonth: today().slice(0, 7),   // "YYYY-MM"
  histSel: today(),
  histExId: "chest-press",
  wtRange: "month",                  // 体重グラフの表示範囲 week|month|all
  sheet: null,                       // 入力シート状態
  picker: null,                      // {mode:'s'|'c', custom:bool}
};

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TABS = [
  { id: "home",      label: "ホーム", icon: '<path d="M4 11.5 12 4.5l8 7V20h-5.5v-5h-5v5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>' },
  { id: "record",    label: "記録",   icon: '<circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' },
  { id: "history",   label: "履歴",   icon: '<rect x="4" y="5.5" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8.5 4v3M15.5 4v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' },
  { id: "challenge", label: "挑戦",   icon: '<circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>' },
  { id: "diet",      label: "食事",   icon: '<path d="M4.5 11.5h15a7.5 7.5 0 0 1-15 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 8.5c0-1.2 1-1.4 1-2.5M12 8.5c0-1.2 1-1.4 1-2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' },
];

function renderTabbar() {
  $("#tabbar").innerHTML = TABS.map(t =>
    '<button class="tab' + (state.view === t.id ? " active" : "") + '" data-action="nav" data-view="' + t.id + '" aria-label="' + t.label + '">' +
    '<svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true">' + t.icon + "</svg>" + t.label + "</button>"
  ).join("");
  $("#settings-btn").classList.toggle("active", state.view === "settings");
}

function render() {
  renderTabbar();
  const v = state.view;
  const el = $("#view");
  if (!settings) { el.innerHTML = ""; renderOnboarding(); return; }
  if (v === "home") el.innerHTML = viewHome();
  else if (v === "record") el.innerHTML = viewRecord();
  else if (v === "history") el.innerHTML = viewHistory();
  else if (v === "challenge") el.innerHTML = viewChallenge();
  else if (v === "diet") el.innerHTML = viewDiet();
  else if (v === "settings") el.innerHTML = viewSettings();
  window.scrollTo(0, 0);
}

/* ---------------- ホーム ---------------- */
function viewHome() {
  const t = today();
  const wk = weekStats(t);
  const log = getWeightLog();
  const todayW = log[t];
  const rec = recommendToday();
  const lastD = lastWorkoutDate();
  const lastW = lastD ? getWorkout(lastD) : null;
  const plt = partLastTrained();
  const restDone = wk.strengthDays + (wk.cardioMin > 0 ? 0 : 0) >= (settings.daysPerWeek || 2);
  /* 前日比 */
  let diffTxt = "";
  const wDates = Object.keys(log).sort();
  if (todayW && wDates.length >= 2) {
    const prevDate = wDates.filter(d => d < t).pop();
    if (prevDate) {
      const diff = Math.round((todayW.kg - log[prevDate].kg) * 10) / 10;
      diffTxt = (diff > 0 ? "+" : "") + diff + "kg(" + fmtMD(prevDate) + "比)";
    }
  }

  let html = "";
  html += '<div class="row between" style="margin:2px 2px 12px">' +
    '<div style="font-size:19px;font-weight:800">' + fmtMD(t) + "(" + dowJp(t) + ")</div>" +
    (isBeginner() ? '<span class="chip accent">初心者期: フォーム優先</span>' : "") + "</div>";

  /* 今週の目標(WHO準拠) */
  const cardioPct = Math.min(100, Math.round(wk.cardioMin / 150 * 100));
  const strengthPct = Math.min(100, Math.round(wk.strengthDays / 2 * 100));
  html += '<div class="card"><h2>今週の目標 <span class="h-extra muted small">' + fmtMD(wk.weekStart) + "〜(WHO目安)</span></h2>" +
    '<div class="stack">' +
    '<div><div class="row between small" style="margin-bottom:3px"><span class="muted">有酸素(中強度)</span><span class="num">' + wk.cardioMin + ' <span class="muted" style="font-weight:600">/ 150分</span></span></div>' +
    '<div class="bar' + (cardioPct >= 100 ? " done" : "") + '"><i style="width:' + cardioPct + '%"></i></div></div>' +
    '<div><div class="row between small" style="margin-bottom:3px"><span class="muted">筋トレ</span><span class="num">' + wk.strengthDays + ' <span class="muted" style="font-weight:600">/ 2回</span></span></div>' +
    '<div class="bar' + (strengthPct >= 100 ? " done" : "") + '"><i style="width:' + strengthPct + '%"></i></div></div>' +
    "</div>" +
    '<div class="row between" style="margin-top:12px"><div class="stat"><span class="v">' + wk.kcal + '<span style="font-size:13px;font-weight:600"> kcal</span></span><span class="l">今週の合計消費(目安)</span></div>' +
    '<button class="btn btn-primary btn-sm" data-action="nav" data-view="record">今日を記録する</button></div>' +
    (restDone ? '<div class="callout accent">今週の目標回数は達成 🎉 週1〜2日の完全休養も大切です。</div>' : "") +
    "</div>";

  /* 4週間チャレンジ(終了後1週間で非表示) */
  const ch = challengeInfo();
  if (ch && ch.day <= 35) {
    if (!ch.ended) {
      html += '<div class="card"><h2>4週間チャレンジ <span class="h-extra muted small num">Day ' + ch.day + ' / 28</span></h2>' +
        '<div class="cw-row">' +
        ch.weeks.map((wk, i) => {
          const cls = wk.done ? "done" : (wk.current ? "cur" : (wk.future ? "fut" : ""));
          const val = wk.done ? "達成" : (wk.future ? "—" : wk.count + "/" + ch.target);
          return '<div class="cw ' + cls + '"><span>' + (i + 1) + "週目</span><b>" + val + "</b></div>";
        }).join("") + "</div>" +
        '<div class="note" style="margin-top:8px">週' + ch.target + "回の記録で1週達成。休養日も大切に、まずは28日間!</div></div>";
    } else {
      const doneW = ch.weeks.filter(wk => wk.done).length;
      const headline = doneW === 4 ? "4週すべて達成!おめでとうございます 🎉"
        : doneW === 0 ? "28日間おつかれさまでした"
        : "4週中 " + doneW + "週で目標達成!";
      const noteTxt = doneW === 4 ? "記録の習慣ができました。この調子で続けましょう。"
        : "続けていること自体が大きな一歩。この調子で記録を続けましょう。";
      html += '<div class="card"><h2>4週間チャレンジ 完了</h2>' +
        '<div style="font-weight:800;font-size:16px;margin-bottom:4px">' + headline + "</div>" +
        '<div class="note">' + noteTxt + "</div></div>";
    }
  }

  /* 今日のおすすめ */
  html += '<div class="card"><h2>今日のおすすめ</h2>' +
    '<div style="font-weight:800;font-size:15.5px;margin-bottom:6px">' + esc(rec.tpl.name) + "</div>" +
    '<div class="stack" style="gap:4px">' +
    rec.tpl.ids.map(id => {
      const m = mById(id); if (!m) return "";
      const h = exHistory(id, 1);
      const lastTxt = h.length ? fmtSet(h[0].e, m) : m.lo + "〜" + m.hi + (m.repUnit || "回") + " × " + m.sets + "セット";
      return '<div class="row between"><span style="font-weight:700;font-size:13.5px">' + esc(m.name) + ' <span class="muted small">' + esc(m.part) + "</span></span>" +
        '<span class="small muted num" style="font-weight:600">' + esc(lastTxt) + "</span></div>";
    }).join("") +
    '<div class="row between"><span style="font-weight:700;font-size:13.5px">+ 有酸素 <span class="muted small">トレッドミル / バイク</span></span><span class="small muted num" style="font-weight:600">20〜30分</span></div>' +
    "</div>" +
    rec.warns.map(w => '<div class="callout warn">⚠️ ' + esc(w) + "</div>").join("") +
    '<div class="note" style="margin-top:8px">部位の回復状況: ' +
    PARTS.map(p => {
      const d = plt[p];
      if (!d) return '<span class="chip" style="margin:2px 2px 0 0">' + p + " 未</span>";
      const n = daysBetween(d, today());
      const cls = (n < 2 && RECOVERY_WARN_PARTS.includes(p)) ? "warn" : "ok";
      return '<span class="chip ' + cls + '" style="margin:2px 2px 0 0">' + p + " " + (n === 0 ? "今日" : n + "日前") + "</span>";
    }).join("") + "</div>" +
    "</div>";

  /* からだマップ: 最近鍛えた部位ほど濃く光る */
  const ib = {};
  Object.keys(plt).forEach(p => {
    const n = daysBetween(plt[p], t);
    ib[p] = n <= 0 ? 1 : n === 1 ? 0.7 : n === 2 ? 0.45 : n === 3 ? 0.25 : 0;
  });
  html += '<div class="card"><h2>からだマップ <span class="h-extra muted small">最近鍛えた部位</span></h2>' +
    '<div class="bm-row"><div class="bm">' + bodyMapSvg("front", ib) + '</div><div class="bm">' + bodyMapSvg("back", ib) + "</div></div>" +
    '<div class="bm-legend"><span>色=最近度:</span>' +
    [["今日", "r0"], ["昨日", "r1"], ["2日前", "r2"], ["3日前", "r3"]].map(x =>
      '<span class="row" style="gap:3px"><i style="background:' + BM_COLORS[x[1]] + '"></i>' + x[0] + "</span>").join("") +
    "</div></div>";

  /* 体重クイック入力 */
  html += '<div class="card"><h2>体重</h2>' +
    '<div class="row" style="gap:8px">' +
    '<input type="number" id="qw-input" inputmode="decimal" step="0.1" min="20" max="300" placeholder="' + bodyWeightAt(t) + '" value="' + (todayW ? todayW.kg : "") + '" style="flex:1" aria-label="今日の体重(kg)">' +
    '<span class="muted small" style="font-weight:700">kg</span>' +
    '<button class="btn btn-primary btn-sm" data-action="qw-save">' + (todayW ? "更新" : "記録") + "</button></div>" +
    (todayW ? '<div class="note" style="margin-top:6px">今日: <b class="num">' + todayW.kg + 'kg</b>' + (todayW.bodyFat ? ' / 体脂肪率 <b class="num">' + todayW.bodyFat + "%</b>" : "") + (diffTxt ? " / " + diffTxt : "") + "</div>" : "") +
    '<div class="note" style="margin-top:6px">おすすめの測り方: 朝・トイレ後・朝食前。±1〜2kgの日々の変動は水分などによる正常な揺れです。</div>' +
    "</div>";

  /* 前回サマリー */
  if (lastW) {
    html += '<div class="card"><h2>前回のトレーニング <span class="h-extra muted small">' + fmtMD(lastD) + "(" + daysAgoLabel(lastD) + ")</span></h2>" +
      '<div class="stack" style="gap:3px">' +
      (lastW.exercises || []).map(e => '<div class="row between"><span style="font-size:13.5px;font-weight:700">' + esc(e.name) + '</span><span class="small muted num" style="font-weight:600">' + esc(fmtSet(e, mById(e.id))) + "</span></div>").join("") +
      (lastW.cardio || []).map(c => '<div class="row between"><span style="font-size:13.5px;font-weight:700">' + esc(c.name) + '</span><span class="small muted num" style="font-weight:600">' + fmtCardio(c) + "</span></div>").join("") +
      "</div>" +
      '<div class="row between" style="margin-top:8px"><span class="chip accent">約 ' + dayKcal(lastD, lastW) + ' kcal(目安)</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="nav" data-view="challenge">次の挑戦を見る</button></div></div>';
  } else {
    html += '<div class="card"><h2>はじめよう</h2><p style="margin:0 0 10px;font-size:13.5px">まだ記録がありません。最初はフォーム優先、「10〜12回でギリギリできる重さ(RPE 7前後)」から始めましょう。最初の記録と同時に「4週間チャレンジ」がスタートします。</p>' +
      '<button class="btn btn-primary btn-block" data-action="nav" data-view="record">最初のトレーニングを記録</button></div>';
  }

  html += '<footer class="app">マイトレ v1.2 — カロリー・栄養値は推定の目安です。痛みや体調不良がある場合は中止し、専門家に相談してください。</footer>';
  return html;
}

/* ---------------- 記録 ---------------- */
function viewRecord() {
  const d = state.recordDate;
  const w = getWorkout(d) || { exercises: [], cardio: [] };
  const kcal = (w.exercises.length || w.cardio.length) ? dayKcal(d, w) : 0;
  let html = "";
  html += '<div class="card"><div class="row between">' +
    '<label class="field" style="flex:1">日付<input type="date" id="rec-date" value="' + d + '" max="' + today() + '" data-change="rec-date"></label>' +
    '<div class="stat" style="align-items:flex-end;min-width:96px"><span class="v">' + kcal + '<span style="font-size:12px;font-weight:600"> kcal</span></span><span class="l">この日の消費(目安)</span></div>' +
    "</div></div>";

  html += '<div class="row" style="gap:8px;margin-bottom:12px">' +
    '<button class="btn btn-primary btn-block" data-action="open-picker" data-mode="s">+ 筋トレ</button>' +
    '<button class="btn btn-ghost btn-block" data-action="open-picker" data-mode="c">+ 有酸素</button></div>';

  /* 前回まるごとコピー(その日が空のときだけ表示) */
  if (!w.exercises.length && !w.cardio.length) {
    const prevD = workoutDates().filter(x => x < d).pop();
    if (prevD) {
      const pw = getWorkout(prevD);
      const n = ((pw && pw.exercises) || []).length + ((pw && pw.cardio) || []).length;
      if (n) html += '<button class="btn btn-ghost btn-block" style="margin-bottom:12px" data-action="copy-last" data-d="' + prevD + '">📋 前回(' + fmtMD(prevD) + "・" + n + "件)をまるごとコピー</button>";
    }
  }

  const items = [];
  w.exercises.forEach((e, i) => {
    const m = mById(e.id);
    items.push('<button class="list-item" data-action="edit-entry" data-kind="s" data-idx="' + i + '">' +
      '<div class="li-main"><div class="li-title">' + esc(e.name) + ' <span class="muted small" style="font-weight:600">' + esc(e.part) + '</span></div>' +
      '<div class="li-sub">' + esc(fmtSet(e, m)) + "</div></div>" +
      '<span class="chip">' + Math.round(strengthKcal(e, bodyWeightAt(d))) + " kcal</span></button>");
  });
  w.cardio.forEach((c, i) => {
    items.push('<button class="list-item" data-action="edit-entry" data-kind="c" data-idx="' + i + '">' +
      '<div class="li-main"><div class="li-title">' + esc(c.name) + '</div>' +
      '<div class="li-sub">' + fmtCardio(c) + "</div></div>" +
      '<span class="chip">' + Math.round(cardioKcal(c, bodyWeightAt(d))) + " kcal</span></button>");
  });
  html += '<div class="card"><h2>' + fmtMD(d) + "(" + dowJp(d) + ")の記録</h2>" +
    (items.length ? '<div class="list">' + items.join("") + "</div>" : '<p class="note" style="margin:0">まだ記録がありません。上のボタンから追加(タップで編集できます)。</p>') +
    "</div>";

  html += '<p class="note" style="margin:4px 4px 0">💡 痛みがある場合はトレーニングを中止し、医師など専門家に相談してください。カロリーは METs 方式による推定の目安です(筋トレはセット数×約3分で換算)。</p>';
  return html;
}

/* --- 種目ピッカー(ボトムシート) --- */
function renderPicker() {
  const p = state.picker;
  if (!p) return closeModal();
  const mode = p.mode;
  const plt = partLastTrained();

  const item = m => {
    const h = m.type === "s" ? exHistory(m.id, 1) : [];
    const lastTxt = h.length ? "前回: " + fmtSet(h[0].e, m) : "";
    return '<button class="pick-item" data-action="pick-ex" data-id="' + m.id + '">' +
      '<span class="pick-name">' + esc(m.name) +
      (m.memo ? '<span class="small muted" style="display:block;font-weight:500">⚙ ' + esc(m.memo) + "</span>" : "") + "</span>" +
      '<span class="pick-last">' + esc(lastTxt) + "</span></button>";
  };
  const customBlock = presetPart => {
    if (p.custom) {
      return '<div class="card" style="margin-top:12px"><h2>種目を追加</h2><div class="stack">' +
        '<label class="field">種目名<input type="text" id="cx-name" maxlength="30" placeholder="例: ダンベルカール"></label>' +
        (mode === "s"
          ? '<label class="field">部位<select id="cx-part">' + PARTS.map(x => "<option" + (x === presetPart ? " selected" : "") + ">" + x + "</option>").join("") + "</select></label>"
          : '<label class="field">METs(強度の目安: 軽め4 / 中6 / 高め8)<input type="number" id="cx-mets" inputmode="decimal" step="0.1" min="1" max="15" value="5.0"></label>') +
        '<button class="btn btn-primary" data-action="custom-save" data-mode="' + mode + '">追加する</button></div></div>';
    }
    return '<button class="btn btn-ghost btn-block" style="margin-top:12px" data-action="custom-toggle">+ 種目を追加</button>';
  };

  let inner = '<div class="grab"></div>';
  if (mode === "s" && !p.part) {
    /* Step 1: 部位を選ぶ */
    const parts = [...new Set([...PARTS, ...master.filter(m => m.type === "s").map(m => m.part)])];
    inner += '<h3>部位を選ぶ</h3><div class="sub">タップするとその部位の種目一覧が出ます。</div><div class="part-grid">' +
      parts.map(pt => {
        const count = master.filter(m => m.type === "s" && m.part === pt).length;
        if (!count) return "";
        const d = plt[pt];
        let rec;
        if (!d) rec = '<span class="small muted">未実施</span>';
        else {
          const n = daysBetween(d, today());
          const lbl = n === 0 ? "今日" : n + "日前";
          const isWarn = n < 2 && RECOVERY_WARN_PARTS.includes(pt);
          rec = '<span class="small" style="font-weight:700;color:var(--' + (isWarn ? "warn" : "ok") + ')">' + lbl + "</span>";
        }
        return '<button class="part-cell" data-action="pick-part" data-part="' + esc(pt) + '"><b>' + esc(pt) + '</b><span class="small muted">' + count + "種目</span>" + rec + "</button>";
      }).join("") + "</div>" +
      '<div class="note" style="margin-top:10px">緑=回復OK / オレンジ=前回から48時間未満(回復中)</div>';
  } else if (mode === "s") {
    /* Step 2: 部位内の種目一覧 */
    const list = master.filter(m => m.type === "s" && m.part === p.part);
    inner += '<div class="row" style="gap:6px;margin-bottom:2px"><button class="hbtn" style="padding:4px 8px" data-action="pick-back">‹ 部位</button><h3 style="margin:0">' + esc(p.part) + "の種目</h3></div>" +
      '<div class="sub">前回の値が自動でセットされます。</div>';
    if (plt[p.part] != null && state.recordDate === today()) {
      const n = daysBetween(plt[p.part], today());
      /* 同日(同一セッション内)は警告しない。前日トレのみ回復注意 */
      if (n === 1 && RECOVERY_WARN_PARTS.includes(p.part)) {
        inner += '<div class="callout warn" style="margin:0 0 8px">⚠️ ' + esc(p.part) + "は前回から48時間未満です。同じ部位は48〜72時間の回復を推奨します。</div>";
      }
    }
    inner += '<div class="pick-list">' + list.map(item).join("") + "</div>" + customBlock(p.part);
  } else {
    /* 有酸素: フラット一覧 */
    inner += '<h3>有酸素を選ぶ</h3><div class="sub">前回の値が自動でセットされます。</div>' +
      '<div class="pick-list">' + master.filter(m => m.type === "c").map(item).join("") + "</div>" + customBlock(null);
  }
  openModal('<div class="sheet">' + inner + "</div>");
}

/* --- 入力シート --- */
function openSheetFor(id, kind, editIdx) {
  const d = state.recordDate;
  const w = getWorkout(d) || { exercises: [], cardio: [] };
  const m = mById(id);
  if (kind === "s") {
    let init;
    if (editIdx != null) {
      init = { ...w.exercises[editIdx] };
    } else {
      const h = exHistory(id, 1);
      if (h.length) init = { ...h[0].e };
      else init = { id, name: m.name, part: m.part, weight: m.unit === 0 ? 0 : 20, reps: m.lo, sets: m.sets || 2, rpe: 7 };
      init.id = id; init.name = m.name; init.part = m.part;
    }
    if (init.setDetails) init.setDetails = init.setDetails.map(x => ({ ...x }));
    state.sheet = { kind: "s", date: d, editIdx: editIdx ?? null, e: init, perSet: !!init.setDetails, memo: m.memo || "" };
  } else {
    let init;
    if (editIdx != null) init = { ...w.cardio[editIdx] };
    else {
      const prev = latestCardio(id);
      init = prev ? { ...prev } : { id, name: m.name, minutes: 20, distance: null, mets: m.mets };
      init.id = id; init.name = m.name; init.mets = m.mets;
    }
    state.sheet = { kind: "c", date: d, editIdx: editIdx ?? null, e: init };
  }
  renderSheet();
}
function latestCardio(id) {
  const dates = workoutDates().reverse();
  for (const d of dates) {
    const w = getWorkout(d);
    for (const c of (w.cardio || [])) if (c.id === id) return c;
  }
  return null;
}
function renderSheet() {
  const s = state.sheet;
  if (!s) return closeModal();
  const e = s.e;
  const m = mById(e.id) || {};
  const isEdit = s.editIdx != null;
  let inner = '<div class="grab"></div><h3>' + esc(e.name) + '</h3><div class="sub">' + fmtMD(s.date) + "(" + dowJp(s.date) + ")" + (m.lo ? " / 目標 " + m.lo + "〜" + m.hi + (m.repUnit || "回") + " × " + (m.sets || 2) + "セット" : "") + (m.note ? " / " + esc(m.note) : "") + "</div>";

  if (s.kind === "s") {
    /* 48時間注意 */
    if (!isEdit && s.date === today()) {
      const plt = partLastTrained();
      if (plt[e.part] != null) {
        const n = daysBetween(plt[e.part], today());
        /* 同日(同一セッション内)は対象外。前日トレのみ回復注意 */
        if (n === 1 && RECOVERY_WARN_PARTS.includes(e.part)) inner += '<div class="callout warn" style="margin-bottom:10px">⚠️ ' + esc(e.part) + "は前回から48時間未満です。同じ部位は48〜72時間の回復を推奨します。</div>";
      }
    }
    const ru = m.repUnit || "回";
    const step = stepFor(m) || 2.5;
    inner += '<div class="stack" style="gap:12px">';
    if (s.perSet) {
      /* セットごとの詳細記録 */
      const sd = e.setDetails || [];
      inner += '<div><div class="row between" style="margin-bottom:6px"><span class="small muted" style="font-weight:700">セットごとの記録</span>' +
        '<button class="hbtn" style="padding:2px 8px" data-action="perset-off">まとめて記録に戻す</button></div>' +
        '<div class="stack" style="gap:6px">' +
        sd.map((x, i) =>
          '<div class="row" style="gap:6px">' +
          '<span class="small muted" style="font-weight:700;min-width:46px">セット' + (i + 1) + "</span>" +
          (m.unit !== 0
            ? '<input type="number" inputmode="decimal" step="0.5" min="0" value="' + x.w + '" data-input="setrow" data-i="' + i + '" data-f="w" aria-label="セット' + (i + 1) + 'の重量(kg)" style="text-align:center;font-weight:700;width:auto;flex:1;min-width:0"><span class="small muted" style="font-weight:700;white-space:nowrap">kg ×</span>'
            : "") +
          '<input type="number" inputmode="numeric" step="1" min="1" value="' + x.r + '" data-input="setrow" data-i="' + i + '" data-f="r" aria-label="セット' + (i + 1) + 'の' + (ru === "秒" ? "秒数" : "回数") + '" style="text-align:center;font-weight:700;width:auto;flex:1;min-width:0"><span class="small muted" style="font-weight:700;white-space:nowrap">' + ru + "</span>" +
          '<button class="st-btn" style="min-width:40px;min-height:40px" data-action="set-del" data-i="' + i + '" aria-label="セット' + (i + 1) + 'を削除">✕</button>' +
          "</div>").join("") +
        "</div>" +
        '<button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" data-action="set-add">+ セット追加(前のセットをコピー)</button></div>';
    } else {
      if (m.unit !== 0) {
        inner += '<div><div class="small muted" style="font-weight:700;margin-bottom:4px">重量(kg)</div>' +
          '<div class="stepper"><button class="st-btn" data-action="step" data-f="weight" data-d="-' + step + '">−</button>' +
          '<input type="number" inputmode="decimal" step="0.5" min="0" value="' + e.weight + '" data-input="sheet" data-f="weight" aria-label="重量">' +
          '<button class="st-btn" data-action="step" data-f="weight" data-d="' + step + '">+</button></div></div>';
      }
      inner += '<div><div class="small muted" style="font-weight:700;margin-bottom:4px">' + (ru === "秒" ? "キープ時間(秒)" : "回数(各セット)") + "</div>" +
        '<div class="stepper"><button class="st-btn" data-action="step" data-f="reps" data-d="-' + (ru === "秒" ? 5 : 1) + '">−</button>' +
        '<input type="number" inputmode="numeric" step="1" min="1" value="' + e.reps + '" data-input="sheet" data-f="reps" aria-label="回数">' +
        '<button class="st-btn" data-action="step" data-f="reps" data-d="' + (ru === "秒" ? 5 : 1) + '">+</button></div></div>';
      inner += '<div><div class="small muted" style="font-weight:700;margin-bottom:4px">セット数</div>' +
        '<div class="stepper"><button class="st-btn" data-action="step" data-f="sets" data-d="-1">−</button>' +
        '<input type="number" inputmode="numeric" step="1" min="1" max="10" value="' + e.sets + '" data-input="sheet" data-f="sets" aria-label="セット数">' +
        '<button class="st-btn" data-action="step" data-f="sets" data-d="1">+</button></div></div>';
      inner += '<button class="btn btn-ghost btn-sm" data-action="perset-on">セットごとに細かく記録(重量・回数を個別に)</button>';
    }
    /* RPE */
    const rpeCls = v => v <= 6 ? "sel-ok" : (v <= 8 ? "sel-warn" : "sel-danger");
    inner += '<div><div class="small muted" style="font-weight:700;margin-bottom:4px">RPE(最終セットのキツさ 1〜10)</div><div class="rpe-row">' +
      Array.from({ length: 10 }, (_, i) => i + 1).map(v =>
        '<button class="rpe-cell' + (e.rpe === v ? " " + rpeCls(v) : "") + '" data-action="rpe" data-v="' + v + '">' + v + "</button>").join("") +
      '</div><div class="note" style="margin-top:5px">' + rpeHint(e.rpe) + "</div></div>";
    /* マシン設定メモ(種目ごとに記憶) */
    inner += '<label class="field">マシン設定メモ(シート高さ・ピン位置など)<input type="text" maxlength="60" value="' + esc(s.memo) + '" placeholder="例: シート4・背もたれ3" data-input="sheet-memo"></label>';
    inner += "</div>";
  } else {
    const distField = '<label class="field" style="flex:1">距離(km・任意)<input type="number" inputmode="decimal" step="0.1" min="0" value="' + (e.distance ?? "") + '" placeholder="—" data-input="sheet" data-f="distance"></label>';
    inner += '<div class="stack" style="gap:12px">' +
      '<div><div class="small muted" style="font-weight:700;margin-bottom:4px">時間(分)</div>' +
      '<div class="stepper"><button class="st-btn" data-action="step" data-f="minutes" data-d="-5">−</button>' +
      '<input type="number" inputmode="numeric" step="1" min="1" value="' + e.minutes + '" data-input="sheet" data-f="minutes" aria-label="時間(分)">' +
      '<button class="st-btn" data-action="step" data-f="minutes" data-d="5">+</button></div></div>' +
      (m.incline
        ? '<div class="row" style="gap:8px">' + distField +
          '<label class="field" style="flex:1">傾斜(%・任意)<input type="number" inputmode="decimal" step="0.5" min="0" max="15" value="' + (e.incline ?? "") + '" placeholder="0" data-input="sheet" data-f="incline"></label></div>'
        : distField) +
      "</div>";
    if (m.incline) inner += '<div class="note" style="margin-top:8px">傾斜を入れると消費カロリーの推定に反映されます(目安)。</div>';
  }

  const kcalPrev = s.kind === "s"
    ? strengthKcal(s.perSet && e.setDetails && e.setDetails.length ? { ...e, sets: e.setDetails.length } : e, bodyWeightAt(s.date))
    : cardioKcal(e, bodyWeightAt(s.date));
  inner += '<div class="row between" style="margin-top:14px"><span class="chip">約 ' + Math.round(kcalPrev) + ' kcal(目安)</span></div>';
  inner += '<div class="row" style="gap:8px;margin-top:12px">' +
    (isEdit ? '<button class="btn btn-danger" data-action="sheet-del">削除</button>' : "") +
    '<button class="btn btn-ghost" data-action="close-modal">閉じる</button>' +
    '<button class="btn btn-primary" style="flex:1" data-action="sheet-save">' + (isEdit ? "更新する" : "記録する") + "</button></div>";
  openModal('<div class="sheet">' + inner + "</div>");
}
function rpeHint(v) {
  if (!v) return "";
  if (v <= 5) return "RPE " + v + ": かなり余裕あり";
  if (v === 6) return "RPE 6: 余裕あり(あと4回以上できる)";
  if (v === 7) return "RPE 7: ちょうど良い(あと3回できる)";
  if (v === 8) return "RPE 8: キツい(あと2回できる)";
  if (v === 9) return "RPE 9: 限界近い(あと1回)";
  return "RPE 10: 限界。続くようなら負荷を下げましょう";
}

/* ---------------- 履歴 ---------------- */
function viewHistory() {
  let html = '<div class="seg">' +
    ["cal:カレンダー", "ex:種目の推移", "wt:体重"].map(x => {
      const [k, l] = x.split(":");
      return '<button class="' + (state.histSeg === k ? "active" : "") + '" data-action="hist-seg" data-k="' + k + '">' + l + "</button>";
    }).join("") + "</div>";
  if (state.histSeg === "cal") html += histCalendar();
  else if (state.histSeg === "ex") html += histExercise();
  else html += histWeight();
  return html;
}
function histCalendar() {
  const [y, mo] = state.histMonth.split("-").map(Number);
  const first = new Date(y, mo - 1, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysIn = new Date(y, mo, 0).getDate();
  const log = getWeightLog();
  let monthKcal = 0;
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<div></div>");
  for (let day = 1; day <= daysIn; day++) {
    const ds = y + "-" + pad2(mo) + "-" + pad2(day);
    const w = getWorkout(ds);
    if (w) monthKcal += dayKcal(ds, w);
    const dots = (w ? '<span class="dot w"></span>' : "") + (log[ds] ? '<span class="dot bw"></span>' : "");
    const cls = ["cal-cell", "day"];
    if (ds === today()) cls.push("today");
    if (ds === state.histSel) cls.push("sel");
    cells.push('<button class="' + cls.join(" ") + '" data-action="cal-day" data-d="' + ds + '"><span>' + day + '</span><span class="cal-dots">' + dots + "</span></button>");
  }
  let html = '<div class="card"><div class="cal-head">' +
    '<button class="cal-nav" data-action="cal-nav" data-d="-1" aria-label="前の月">‹</button>' +
    '<div class="cal-title">' + y + "年" + mo + '月 <span class="muted small num" style="font-weight:600">計 ' + monthKcal + " kcal(目安)</span></div>" +
    '<button class="cal-nav" data-action="cal-nav" data-d="1" aria-label="次の月">›</button></div>' +
    '<div class="cal-grid">' + DOW.map(d => '<div class="cal-dow">' + d + "</div>").join("") + cells.join("") + "</div>" +
    '<div class="note" style="margin-top:8px"><span class="dot w" style="display:inline-block"></span> トレーニング　<span class="dot bw" style="display:inline-block"></span> 体重記録</div></div>';

  /* 選択日の詳細 */
  const sel = state.histSel;
  const w = getWorkout(sel);
  const wl = log[sel];
  let detail = "";
  if (w) {
    detail += '<div class="stack" style="gap:3px">' +
      (w.exercises || []).map((e, i) => '<button class="list-item" data-action="edit-hist" data-kind="s" data-idx="' + i + '" data-d="' + sel + '"><div class="li-main"><div class="li-title">' + esc(e.name) + '</div><div class="li-sub">' + esc(fmtSet(e, mById(e.id))) + "</div></div><span class='muted small'>編集</span></button>").join("") +
      (w.cardio || []).map((c, i) => '<button class="list-item" data-action="edit-hist" data-kind="c" data-idx="' + i + '" data-d="' + sel + '"><div class="li-main"><div class="li-title">' + esc(c.name) + '</div><div class="li-sub">' + fmtCardio(c) + "</div></div><span class='muted small'>編集</span></button>").join("") +
      "</div>" +
      '<div class="chip accent" style="margin-top:8px">約 ' + dayKcal(sel, w) + " kcal(目安)</div>";
  } else {
    detail += '<p class="note" style="margin:0 0 8px">この日のトレーニング記録はありません。</p>';
  }
  if (w && (w.exercises || []).length) {
    const ibd = {};
    (w.exercises || []).forEach(e => { ibd[e.part] = 1; });
    detail += '<div class="bm-row" style="margin-top:10px"><div class="bm">' + bodyMapSvg("front", ibd) + '</div><div class="bm">' + bodyMapSvg("back", ibd) + "</div></div>" +
      '<div class="note" style="margin-top:6px">この日に鍛えた部位</div>';
  }
  if (wl) detail += '<div class="note" style="margin-top:6px">体重: <b class="num">' + wl.kg + "kg</b>" + (wl.bodyFat ? " / 体脂肪率 " + wl.bodyFat + "%" : "") + "</div>";
  if (sel <= today()) detail += '<button class="btn btn-ghost btn-sm" style="margin-top:10px" data-action="goto-record" data-d="' + sel + '">この日の記録を追加する</button>';
  html += '<div class="card"><h2>' + fmtMD(sel) + "(" + dowJp(sel) + ")</h2>" + detail + "</div>";
  return html;
}
function histExercise() {
  const sList = master.filter(m => m.type === "s");
  if (!sList.find(m => m.id === state.histExId)) state.histExId = sList[0] ? sList[0].id : null;
  const m = mById(state.histExId);
  const hist = state.histExId ? exHistory(state.histExId, 40).slice().reverse() : []; // 古い順
  let html = '<div class="card"><h2>種目別の重量推移</h2>' +
    '<select data-change="hist-ex" aria-label="種目を選択">' +
    sList.map(x => '<option value="' + x.id + '"' + (x.id === state.histExId ? " selected" : "") + ">" + esc(x.name) + "</option>").join("") + "</select>";
  if (!hist.length) {
    html += '<p class="note" style="margin:10px 0 0">この種目の記録はまだありません。</p></div>';
    return html;
  }
  const ru = (m && m.repUnit) || "回";
  const isTime = ru === "秒" || !hist.some(h => h.e.weight > 0);
  const pts = hist.map(h => ({ x: parseD(h.date).getTime(), y: isTime ? h.e.reps : h.e.weight, label: fmtMD(h.date) }));
  html += '<div class="chart-wrap" style="margin-top:10px">' + svgLineChart({ series: [{ pts, color: "var(--accent)", width: 2.5, dots: true }], yUnit: isTime ? ru : "kg" }) + "</div>";
  const lastH = hist[hist.length - 1];
  const firstH = hist[0];
  const diff = Math.round(((isTime ? lastH.e.reps - firstH.e.reps : lastH.e.weight - firstH.e.weight)) * 10) / 10;
  html += '<div class="kv" style="margin-top:10px">' +
    '<span class="k">最新(' + fmtMD(lastH.date) + ')</span><span class="v">' + esc(fmtSet(lastH.e, m)) + "</span>" +
    '<span class="k">開始(' + fmtMD(firstH.date) + ')</span><span class="v">' + esc(fmtSet(firstH.e, m)) + "</span>" +
    '<span class="k">伸び</span><span class="v">' + (diff > 0 ? "+" : "") + diff + (isTime ? ru : "kg") + "</span></div></div>";
  /* 直近ログ */
  html += '<div class="card"><h2>直近の記録</h2><div class="stack" style="gap:3px">' +
    hist.slice(-8).reverse().map(h => '<div class="row between"><span class="small muted">' + fmtMD(h.date) + "(" + dowJp(h.date) + ')</span><span class="small num" style="font-weight:700">' + esc(fmtSet(h.e, m)) + "</span></div>").join("") +
    "</div></div>";
  return html;
}
function histWeight() {
  const log = getWeightLog();
  const dates = Object.keys(log).sort();
  let html = '<div class="card"><h2>体重の推移 <span class="h-extra muted small">7日移動平均</span></h2>';
  if (dates.length < 1) {
    return html + '<p class="note" style="margin:0">体重の記録はまだありません。ホームから記録できます。</p></div>';
  }
  const range = state.wtRange || "month";
  html += '<div class="seg" style="margin-bottom:10px">' +
    [["week", "週"], ["month", "月"], ["all", "全期間"]].map(x =>
      '<button class="' + (range === x[0] ? "active" : "") + '" data-action="wt-range" data-r="' + x[0] + '">' + x[1] + "</button>").join("") +
    "</div>";
  let from = dates[0]; /* 全期間 = 最初の記録日から */
  if (range === "week") from = addDays(today(), -6);
  else if (range === "month") from = addDays(today(), -29);
  const shown = dates.filter(d => d >= from);
  const latest = dates[dates.length - 1];
  /* 最新の7日移動平均(表示範囲に関係なく全データから算出) */
  const f0 = addDays(latest, -6);
  const lv = dates.filter(x => x >= f0 && x <= latest).map(x => log[x].kg);
  const latestMA = Math.round(lv.reduce((a, b) => a + b, 0) / lv.length * 100) / 100;
  if (!shown.length) {
    html += '<p class="note" style="margin:0 0 8px">この期間の体重記録はありません。</p>';
  } else {
    const daily = shown.map(d => ({ x: parseD(d).getTime(), y: log[d].kg }));
    /* 7日移動平均(その日を含む過去7日間に存在する記録の平均。範囲外の過去データも参照) */
    const ma = shown.map(d => {
      const f = addDays(d, -6);
      const vals = dates.filter(x => x >= f && x <= d).map(x => log[x].kg);
      return { x: parseD(d).getTime(), y: Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 100) / 100 };
    });
    html += '<div class="chart-wrap">' + svgLineChart({
      series: [
        { pts: daily, color: "var(--line)", width: 1.5, dots: true, dotColor: "var(--muted)" },
        { pts: ma, color: "var(--accent)", width: 2.5, dots: false },
      ], yUnit: "kg",
    }) + "</div>";
  }
  const rangeLabel = range === "week" ? "直近7日" : range === "month" ? "直近30日" : (shown.length ? fmtMD(shown[0]) + "〜" : "全期間");
  const diffTxt = shown.length >= 2 ? (v => (v > 0 ? "+" : "") + v + " kg")(Math.round((log[shown[shown.length - 1]].kg - log[shown[0]].kg) * 10) / 10) : "—";
  html += '<div class="kv" style="margin-top:10px">' +
    '<span class="k">最新(' + fmtMD(latest) + ')</span><span class="v">' + log[latest].kg + " kg</span>" +
    '<span class="k">7日平均</span><span class="v">' + latestMA + " kg</span>" +
    '<span class="k">増減(' + rangeLabel + ')</span><span class="v">' + diffTxt + "</span>" +
    (log[latest].bodyFat ? '<span class="k">体脂肪率</span><span class="v">' + log[latest].bodyFat + " %</span>" : "") +
    "</div>" +
    '<div class="note" style="margin-top:8px">日々の±1〜2kgは水分などによる正常な変動です。太い線(7日平均)のトレンドで見ましょう。</div></div>';
  /* 体脂肪率も任意記録 */
  const t = today();
  const tw = log[t];
  html += '<div class="card"><h2>今日の記録</h2><div class="row" style="gap:8px">' +
    '<label class="field" style="flex:1">体重(kg)<input type="number" id="hw-kg" inputmode="decimal" step="0.1" min="20" max="300" value="' + (tw ? tw.kg : "") + '" placeholder="' + bodyWeightAt(t) + '"></label>' +
    '<label class="field" style="flex:1">体脂肪率(%・任意)<input type="number" id="hw-bf" inputmode="decimal" step="0.1" min="1" max="70" value="' + (tw && tw.bodyFat ? tw.bodyFat : "") + '" placeholder="—"></label>' +
    "</div>" +
    '<button class="btn btn-primary btn-block" style="margin-top:10px" data-action="hw-save">保存する</button>' +
    '<div class="note" style="margin-top:8px">おすすめの測り方: 朝・トイレ後・朝食前(条件をそろえると比較しやすい)。</div></div>';
  return html;
}

/* ---------------- SVGラインチャート ---------------- */
function svgLineChart({ series, yUnit = "", w = 340, h = 180 }) {
  const pad = { t: 14, r: 14, b: 24, l: 40 };
  const all = series.flatMap(s => s.pts);
  if (!all.length) return "";
  let xmin = Math.min(...all.map(p => p.x)), xmax = Math.max(...all.map(p => p.x));
  let ymin = Math.min(...all.map(p => p.y)), ymax = Math.max(...all.map(p => p.y));
  if (xmin === xmax) { xmin -= 86400000; xmax += 86400000; }
  const yPad = Math.max((ymax - ymin) * 0.12, 0.8);
  ymin -= yPad; ymax += yPad;
  const X = x => pad.l + (x - xmin) / (xmax - xmin) * (w - pad.l - pad.r);
  const Y = y => pad.t + (1 - (y - ymin) / (ymax - ymin)) * (h - pad.t - pad.b);
  let out = '<svg viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="推移グラフ">';
  /* y grid: 4本 */
  for (let i = 0; i <= 3; i++) {
    const yv = ymin + (ymax - ymin) * i / 3;
    const yy = Y(yv);
    out += '<line x1="' + pad.l + '" y1="' + yy + '" x2="' + (w - pad.r) + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pad.l - 6) + '" y="' + (yy + 3.5) + '" text-anchor="end" font-size="9.5" fill="var(--muted)" style="font-variant-numeric:tabular-nums">' + (Math.round(yv * 10) / 10) + "</text>";
  }
  /* x labels: 最初と最後 */
  const fmtX = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate(); };
  out += '<text x="' + pad.l + '" y="' + (h - 8) + '" font-size="9.5" fill="var(--muted)">' + fmtX(xmin) + "</text>" +
    '<text x="' + (w - pad.r) + '" y="' + (h - 8) + '" text-anchor="end" font-size="9.5" fill="var(--muted)">' + fmtX(xmax) + "</text>";
  series.forEach(s => {
    if (s.pts.length > 1) {
      const dPath = s.pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("");
      out += '<path d="' + dPath + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2) + '" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    if (s.dots) s.pts.forEach(p => {
      out += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3" fill="' + (s.dotColor || s.color) + '"/>';
    });
    /* 最終点の強調 + 値ラベル */
    const lp = s.pts[s.pts.length - 1];
    if (lp && !s.dotColor) {
      out += '<circle cx="' + X(lp.x).toFixed(1) + '" cy="' + Y(lp.y).toFixed(1) + '" r="4" fill="' + s.color + '"/>' +
        '<text x="' + Math.min(X(lp.x) + 6, w - pad.r) + '" y="' + (Y(lp.y) - 7) + '" font-size="10.5" font-weight="700" fill="' + s.color + '" text-anchor="end" style="font-variant-numeric:tabular-nums">' + lp.y + yUnit + "</text>";
    }
  });
  return out + "</svg>";
}

/* 経過日数 → 色(今日=赤 / 昨日=オレンジ / 2日前=水色 / 3日前=黄緑) */
const BM_COLORS = { r0: "#FF4D42", r1: "#FFA23E", r2: "#55C8FF", r3: "#A8E34D" };
function bmColorKey(v) { return v >= 1 ? "r0" : v >= 0.7 ? "r1" : v >= 0.45 ? "r2" : "r3"; }
function bodyMapSvg(face, ib) {
  let hl = "";
  Object.keys(BM_PART_IMG[face]).forEach(part => {
    const v = ib[part] || 0;
    if (!v) return;
    hl += '<image href="' + BM_PART_IMG[face][part] + '" width="360" height="532" opacity="0.85" filter="url(#bmc-' + bmColorKey(v) + ')"/>';
  });
  const filters = Object.keys(BM_COLORS).map(k =>
    '<filter id="bmc-' + k + '" x="-30%" y="-30%" width="160%" height="160%">' +
    '<feFlood flood-color="' + BM_COLORS[k] + '" result="c"/>' +
    '<feComposite in="c" in2="SourceAlpha" operator="in" result="m"/>' +
    '<feGaussianBlur in="m" stdDeviation="2"/></filter>').join("");
  return '<svg viewBox="0 0 360 532" role="img" aria-label="' + (face === "front" ? "前面" : "背面") + 'の筋肉マップ">' +
    '<image href="' + BODY_IMG[face] + '" width="360" height="532" preserveAspectRatio="xMidYMid slice"/>' +
    '<g style="mix-blend-mode:screen">' + hl + "</g>" +
    "<defs>" + filters + "</defs>" +
    '<text x="12" y="522" font-size="11" font-weight="700" fill="#B9CEC9">' + (face === "front" ? "前面" : "背面") + "</text></svg>";
}

/* ---------------- 挑戦 ---------------- */
function viewChallenge() {
  let html = "";
  if (isBeginner()) {
    html += '<div class="callout accent" style="margin-bottom:12px">🌱 <b>初心者期(最初の4〜8週)</b>: 重量より先に、フォームと回数の安定を優先する提案になっています。</div>';
  }
  const sList = master.filter(m => m.type === "s");
  const withHist = [];
  sList.forEach(m => {
    const s = suggestFor(m.id);
    if (s && s.type !== "first") withHist.push(s); /* 記録のある種目のみ提案(未記録の一覧は出さない) */
  });
  const order = { down: 0, up: 1, reps: 2, keep: 3 };
  withHist.sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9));

  if (!withHist.length) {
    html += '<div class="card"><h2>次の挑戦</h2><p style="margin:0;font-size:13.5px">記録がたまると、種目ごとに「次に何をすべきか」をトレーナー視点で提案します。まずは1回記録してみましょう。</p>' +
      '<button class="btn btn-primary btn-block" style="margin-top:10px" data-action="nav" data-view="record">記録する</button></div>';
  }
  withHist.forEach(s => {
    html += '<div class="card">' +
      '<div class="row between" style="margin-bottom:6px"><span style="font-weight:800;font-size:15px">' + esc(s.m.name) + ' <span class="muted small" style="font-weight:600">' + esc(s.m.part) + "</span></span>" +
      '<span class="sugg-badge ' + s.cls + '">' + s.badge + "</span></div>" +
      (s.last ? '<div class="li-sub" style="margin-bottom:6px">前回(' + daysAgoLabel(s.lastDate) + "): " + esc(s.last) + "</div>" : "") +
      '<div style="font-weight:800;font-size:15.5px;margin-bottom:4px">' + esc(s.title) + "</div>" +
      '<div class="note">' + esc(s.detail) + "</div></div>";
  });
  if (withHist.length) {
    html += '<p class="note" style="margin:0 4px 12px">記録のある種目だけ表示しています。新しい種目は「' + (isBeginner() ? "目標回数でギリギリできる重さ(RPE 7前後)" : "目標回数でギリギリの負荷") + "」から始めましょう。</p>";
  }
  html += '<p class="note" style="margin:4px 4px 0">提案は漸進性過負荷の原則に基づく目安です。フォームが崩れる場合・痛みがある場合は重量を上げず、必要に応じて専門家に相談してください。</p>';
  return html;
}

/* ---------------- 食事 ---------------- */
function viewDiet() {
  const w = bodyWeightAt(today());
  const goal = GOALS[settings.goal] || GOALS.maintain;
  const kcalLo = Math.round(w * 30 + goal.adj), kcalHi = Math.round(w * 35 + goal.adj);
  const kcalMid = Math.round((kcalLo + kcalHi) / 2);
  const pLo = Math.round(w * 1.2), pHi = Math.round(w * 1.6);
  const pMid = Math.round((pLo + pHi) / 2);
  const fLo = Math.round(kcalMid * 0.20 / 9), fHi = Math.round(kcalMid * 0.30 / 9);
  const fMid = Math.round((fLo + fHi) / 2);
  const cMid = Math.max(0, Math.round((kcalMid - pMid * 4 - fMid * 9) / 4));

  let html = '<div class="card"><h2>今日の目安 <span class="h-extra muted small">体重 ' + w + 'kg / ' + esc(goal.label) + "</span></h2>" +
    '<div class="stat"><span class="v">' + kcalLo + "〜" + kcalHi + '<span style="font-size:13px;font-weight:600"> kcal</span></span><span class="l">1日の目安カロリー(' + esc(goal.desc) + ")</span></div>" +
    '<div class="pfc">' +
    '<div class="cell"><span>たんぱく質</span><b class="num">' + pLo + "〜" + pHi + 'g</b><span>体重×1.2〜1.6g</span></div>' +
    '<div class="cell"><span>脂質</span><b class="num">' + fLo + "〜" + fHi + 'g</b><span>約20〜30%</span></div>' +
    '<div class="cell"><span>炭水化物</span><b class="num">約' + cMid + 'g</b><span>残り</span></div>' +
    "</div>" +
    '<div class="note" style="margin-top:10px">最新の記録体重から自動計算しています。数値はあくまで一般的な目安で、個人差があります。</div></div>';

  html += '<div class="card"><h2>トレーニング後の補食例 <span class="h-extra muted small">たんぱく質20g前後+糖質</span></h2>' +
    '<div class="stack" style="gap:8px">' +
    [
      ["プロテイン1杯 + バナナ1本", "P 約21g / 糖質 約27g"],
      ["ギリシャヨーグルト + おにぎり1個", "P 約18g / 糖質 約45g"],
      ["牛乳200ml + ツナおにぎり", "P 約17g / 糖質 約42g"],
      ["サラダチキン + 100%オレンジジュース", "P 約22g / 糖質 約25g"],
    ].map(x => '<div class="row between"><span style="font-weight:700;font-size:13.5px">' + x[0] + '</span><span class="small muted num" style="font-weight:600">' + x[1] + "</span></div>").join("") +
    '</div><div class="note" style="margin-top:8px">目安はトレーニング後1〜2時間以内。1日全体のたんぱく質を数回に分けて摂るのがおすすめです。</div></div>';

  html += '<div class="card"><h2>目標</h2><select data-change="diet-goal">' +
    Object.keys(GOALS).map(k => '<option value="' + k + '"' + (settings.goal === k ? " selected" : "") + ">" + GOALS[k].label + "</option>").join("") +
    '</select><div class="note" style="margin-top:8px">' + esc(goal.desc) + "。目標は設定画面からも変更できます。</div></div>";

  html += '<p class="note" style="margin:4px 4px 0">本アプリの食事情報は一般的な情報提供であり、医療・栄養指導ではありません。体調に不安がある場合は医師・管理栄養士に相談してください。</p>';
  return html;
}

  let html = '<div class="card"><h2>プロフィール</h2><div class="stack">' +
    '<label class="field">体重の初期値(kg)— 体重記録があればそちらを優先<input type="number" inputmode="decimal" step="0.1" min="20" max="300" value="' + s.weight + '" data-change="set-weight"></label>' +

    '<ul style="margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px">' +
    "<li><b>フォーム &gt; 重量</b>: 初心者期は重量アップを急がない</li>" +
    "<li><b>回復の確保</b>: 同じ部位は48〜72時間空ける。週1〜2日は完全休養を</li>" +
    "<li><b>痛みのシグナル</b>: 痛みがある場合は中止し、医師など専門家に相談する</li>" +
    "<li><b>数値は目安</b>: カロリー・栄養は推定であり個人差がある</li>" +
    "<li><b>追い込みすぎ防止</b>: RPE 9〜10が続いたら負荷を下げる</li></ul></div>";

  html += '<div class="card"><h2>免責・注意事項</h2>' +
    '<ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px">' +
    "<li>本アプリは医療・診断・治療を目的としません</li>" +
    "<li>カロリー・栄養値はあくまで推定の目安です</li>" +
    "<li>痛みや体調不良がある場合は使用を中止し、専門家に相談してください</li></ul>" +
    '<div class="note" style="margin-top:10px">マイトレ v1.2(企画書v1準拠)</div></div>';
  return html;
}

/* ---------------- オンボーディング ---------------- */
function renderOnboarding() {
  openModal('<div class="overlay-inner modal-box">' +
    '<img src="' + APP_ICON + '" alt="" style="width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 10px">' +

    '<p class="note" style="margin:0 0 14px">記録する → 変化が見える → 次の挑戦がわかる。<br>3項目だけ設定して始めましょう。</p>' +
    '<div class="stack">' +

    '<label class="field">目標<select id="ob-goal">' +
    Object.keys(GOALS).map(k => '<option value="' + k + '"' + (k === "maintain" ? " selected" : "") + ">" + GOALS[k].label + "</option>").join("") + "</select></label>" +

    '<button class="btn btn-primary btn-block" data-action="onboard-save">はじめる</button>' +
