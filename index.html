/* ---------------- modal / toast ---------------- */
function openModal(inner, center) {
  $("#modal-root").innerHTML = '<div class="overlay' + (center ? " modal-center" : "") + '" data-overlay>' + inner + "</div>";
}
function closeModal() {
  $("#modal-root").innerHTML = "";
  state.sheet = null; state.picker = null;
  pendingConfirm = null;
}
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function confirmDialog(msg, okLabel, onOk) {
  pendingConfirm = onOk;
  openModal('<div class="overlay-inner modal-box"><p style="margin:0 0 14px;font-size:14px">' + msg + "</p>" +
    '<div class="row" style="gap:8px;justify-content:flex-end">' +
    '<button class="btn btn-ghost btn-sm" data-action="close-modal">キャンセル</button>' +
    '<button class="btn btn-danger btn-sm" data-action="confirm-ok">' + okLabel + "</button></div></div>", true);
}
let pendingConfirm = null;

/* ---------------- 保存処理 ---------------- */
function saveQuickWeight(kg, bf) {
  if (!(kg > 20 && kg < 300)) { toast("体重は20〜300kgの範囲で入力してください"); return false; }
  const log = getWeightLog();
  const t = today();
  const entry = { kg: Math.round(kg * 10) / 10 };
  if (bf != null && bf >= 1 && bf <= 70) entry.bodyFat = Math.round(bf * 10) / 10;
  else if (bf == null && log[t] && log[t].bodyFat != null) entry.bodyFat = log[t].bodyFat; /* クイック入力(体重のみ)で既存の体脂肪率を消さない */
  log[t] = entry;
  setWeightLog(log);
  /* 体重が変わったら当日のkcalも更新 */
  const w = getWorkout(t);
  if (w) setWorkout(t, w);
  toast("体重を記録しました");
  return true;
}
function sheetSave() {
  const s = state.sheet;
  if (!s) return;
  const e = s.e;
  const d = s.date;
  const w = getWorkout(d) || { exercises: [], cardio: [] };
  if (s.kind === "s") {
    if (s.perSet && e.setDetails && e.setDetails.length) {
      /* 丸め前の生値で検証(空欄を黙って1回や0kgに変換しない) */
      if (e.setDetails.some(x => x.r === "" || !(Number(x.r) >= 1))) { toast("回数が未入力のセットがあります"); return; }
      if (e.setDetails.some(x => x.w === "")) { toast("重量が未入力のセットがあります"); return; }
      /* セット詳細から集計値を導出(重量=最大、回数=最小 → 「全セット達成」判定に使う) */
      e.setDetails = e.setDetails.slice(0, 10).map(x => ({ w: Math.max(0, Number(x.w) || 0), r: Math.max(1, Math.round(Number(x.r))) }));
      e.sets = e.setDetails.length;
      e.weight = Math.max(...e.setDetails.map(x => x.w));
      e.reps = Math.min(...e.setDetails.map(x => x.r));
    } else {
      if (e.weight === "") { toast("重量を入力してください"); return; }
      if (e.reps === "" || !(Number(e.reps) >= 1)) { toast("回数を入力してください"); return; }
      delete e.setDetails;
      e.weight = Math.max(0, Number(e.weight) || 0);
      e.reps = Math.max(1, Math.round(Number(e.reps)));
      e.sets = Math.min(10, Math.max(1, Math.round(Number(e.sets) || 0)));
    }
    if (e.rpe != null) e.rpe = Math.min(10, Math.max(1, Math.round(Number(e.rpe) || 7)));
    /* マシン設定メモは種目マスタに保存(次回から自動表示) */
    const mm = mById(e.id);
    if (mm && (s.memo || "").trim() !== (mm.memo || "")) { mm.memo = (s.memo || "").trim(); saveMaster(); }
    if (s.editIdx != null) w.exercises[s.editIdx] = e;
    else w.exercises.push(e);
  } else {
    if (e.minutes === "" || !(Number(e.minutes) >= 1)) { toast("時間を入力してください"); return; }
    e.minutes = Math.max(1, Math.round(Number(e.minutes)));
    const dist = Number(e.distance);
    e.distance = dist > 0 ? Math.round(dist * 100) / 100 : null;
    const inc = Number(e.incline);
    e.incline = inc > 0 ? Math.min(15, Math.round(inc * 10) / 10) : null;
    if (s.editIdx != null) w.cardio[s.editIdx] = e;
    else w.cardio.push(e);
  }
  setWorkout(d, w);
  closeModal();
  toast(s.editIdx != null ? "更新しました" : "記録しました 💪");
  render();
}
function sheetDelete() {
  const s = state.sheet;
  if (!s || s.editIdx == null) return;
  const w = getWorkout(s.date);
  if (!w) return closeModal();
  if (s.kind === "s") w.exercises.splice(s.editIdx, 1);
  else w.cardio.splice(s.editIdx, 1);
  setWorkout(s.date, w);
  closeModal();
  toast("削除しました");
  render();
}

/* ---------------- エクスポート / インポート ---------------- */
async function exportData() {
  const data = {};
  store.keys().forEach(k => { data[k] = store.get(k); });
  const payload = JSON.stringify({ app: "mytore", version: 1, exportedAt: new Date().toISOString(), data }, null, 1);
  const fname = "mytore-backup-" + today() + ".json";
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename: fname, data: payload });
      toast("バックアップを保存しました");
      return;
    } catch (err) {
      if (err && err.code === "declined") { toast("保存をキャンセルしました"); return; }
      if (err && err.code === "rate_limited") { toast("少し待ってからもう一度お試しください"); return; }
      /* その他はフォールバックへ */
    }
  }
  try {
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("バックアップをダウンロードしました");
  } catch (e2) { toast("エクスポートに失敗しました"); }
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      const data = obj && obj.app === "mytore" && obj.data ? obj.data : null;
      if (!data) { toast("マイトレのバックアップファイルではありません"); return; }
      confirmDialog("バックアップを復元します。<b>現在のデータは上書きされます。</b>よろしいですか?", "復元する", () => {
        store.keys().forEach(k => store.del(k));
        Object.keys(data).forEach(k => store.set(k, data[k]));
        master = store.get("exercise-master") || DEFAULT_MASTER.map(m => ({ ...m }));
        settings = store.get("settings");
        closeModal();
        toast("復元しました");
        render();
      });
    } catch (e) { toast("ファイルを読み込めませんでした"); }
  };
  reader.readAsText(file);
}

/* ---------------- event delegation ---------------- */
const actions = {
  "nav": ds => { state.view = ds.view; render(); },
  "qw-save": () => {
    const v = parseFloat($("#qw-input").value);
    if (saveQuickWeight(v)) render();
  },
  "hw-save": () => {
    const kg = parseFloat($("#hw-kg").value);
    const bfRaw = $("#hw-bf").value;
    const bf = bfRaw === "" ? null : parseFloat(bfRaw);
    if (saveQuickWeight(kg, bf)) render();
  },
  "open-picker": ds => { state.picker = { mode: ds.mode, custom: false }; renderPicker(); },
  "custom-toggle": () => { if (state.picker) { state.picker.custom = true; renderPicker(); } },
  "custom-save": ds => {
    const name = ($("#cx-name").value || "").trim();
    if (!name) { toast("種目名を入力してください"); return; }
    if (master.some(m => m.name === name)) { toast("同じ名前の種目があります"); return; }
    const id = "custom-" + Date.now().toString(36);
    if (ds.mode === "s") {
      const part = $("#cx-part").value;
      master.push({ id, name, part, type: "s", unit: null, lo: 10, hi: 12, sets: 3, repUnit: "回", fav: false, note: "" });
      if (state.picker) state.picker.part = part; /* 追加した部位の一覧へ */
    } else {
      const mets = Math.min(15, Math.max(1, parseFloat($("#cx-mets").value) || 5));
      master.push({ id, name, part: "有酸素", type: "c", mets, fav: false });
    }
    saveMaster();
    if (state.picker) state.picker.custom = false;
    toast("追加しました");
    renderPicker();
  },
  "pick-part": ds => { if (state.picker) { state.picker.part = ds.part; renderPicker(); } },
  "pick-back": () => { if (state.picker) { state.picker.part = null; state.picker.custom = false; renderPicker(); } },
  "pick-ex": ds => { state.picker = null; openSheetFor(ds.id, mById(ds.id).type, null); },
  "edit-entry": ds => {
    const w = getWorkout(state.recordDate);
    if (!w) return;
    const arr = ds.kind === "s" ? w.exercises : w.cardio;
    const e = arr[Number(ds.idx)];
    if (e) openSheetFor(e.id, ds.kind, Number(ds.idx));
  },
  "edit-hist": ds => {
    state.recordDate = ds.d;
    const w = getWorkout(ds.d);
    if (!w) return;
    const arr = ds.kind === "s" ? w.exercises : w.cardio;
    const e = arr[Number(ds.idx)];
    if (e) openSheetFor(e.id, ds.kind, Number(ds.idx));
  },
  "goto-record": ds => { state.recordDate = ds.d > today() ? today() : ds.d; state.view = "record"; render(); },
  "copy-last": ds => {
    const src = getWorkout(ds.d);
    if (!src) return;
    const cur = getWorkout(state.recordDate);
    if (cur && ((cur.exercises || []).length || (cur.cardio || []).length)) { toast("この日にはすでに記録があります"); render(); return; }
    /* RPEはその日の主観値なのでコピーしない(挑戦提案の判定を歪めないため) */
    const w = { exercises: (src.exercises || []).map(e => {
      const c = { ...e }; delete c.rpe;
      if (c.setDetails) c.setDetails = c.setDetails.map(x => ({ ...x }));
      return c;
    }), cardio: (src.cardio || []).map(c => ({ ...c })) };
    setWorkout(state.recordDate, w);
    toast("前回(" + fmtMD(ds.d) + ")の記録をコピーしました。実施したらタップしてRPEを更新しましょう");
    render();
  },
  "step": ds => {
    const s = state.sheet; if (!s) return;
    const f = ds.f;
    const cur = Number(s.e[f]) || 0;
    let v = Math.round((cur + Number(ds.d)) * 100) / 100;
    if (f === "weight") v = Math.max(0, v);
    else if (f === "sets") v = Math.min(10, Math.max(1, v));
    else if (f === "minutes") v = Math.max(1, v);
    else v = Math.max(1, v);
    s.e[f] = v;
    renderSheet();
  },
  "rpe": ds => { const s = state.sheet; if (s) { s.e.rpe = Number(ds.v); renderSheet(); } },
  "perset-on": () => {
    const s = state.sheet; if (!s) return;
    const e = s.e;
    const n = Math.min(10, Math.max(1, Math.round(Number(e.sets) || 1)));
    if (s.stash && s.stash.length === n) {
      /* トグル往復では退避しておいたセット別データを復元(誤タップで消えないように) */
      e.setDetails = s.stash.map(x => ({ ...x }));
    } else {
      e.setDetails = Array.from({ length: n }, () => ({ w: Math.max(0, Number(e.weight) || 0), r: Math.max(1, Math.round(Number(e.reps) || 1)) }));
    }
    s.perSet = true;
    renderSheet();
  },
  "perset-off": () => {
    const s = state.sheet; if (!s) return;
    const e = s.e;
    if (e.setDetails && e.setDetails.length) {
      s.stash = e.setDetails.map(x => ({ ...x })); /* 破棄せず退避。確定は保存時のみ */
      e.sets = e.setDetails.length;
      e.weight = Math.max(...e.setDetails.map(x => Number(x.w) || 0));
      e.reps = Math.min(...e.setDetails.map(x => Math.max(1, Math.round(Number(x.r) || 1))));
    }
    delete e.setDetails;
    s.perSet = false;
    renderSheet();
  },
  "set-add": () => {
    const s = state.sheet; if (!s || !s.e.setDetails) return;
    if (s.e.setDetails.length >= 10) { toast("セットは最大10です"); return; }
    const prev = s.e.setDetails[s.e.setDetails.length - 1] || { w: s.e.weight || 0, r: s.e.reps || 10 };
    s.e.setDetails.push({ w: Number(prev.w) || 0, r: Number(prev.r) || 10 });
    renderSheet();
  },
  "set-del": ds => {
    const s = state.sheet; if (!s || !s.e.setDetails) return;
    if (s.e.setDetails.length <= 1) { toast("最低1セットは必要です"); return; }
    s.e.setDetails.splice(Number(ds.i), 1);
    renderSheet();
  },
  "sheet-save": sheetSave,
  "sheet-del": () => confirmDialog("この記録を削除しますか?", "削除する", () => sheetDelete()),
  "close-modal": closeModal,
  "confirm-ok": () => { const fn = pendingConfirm; pendingConfirm = null; if (fn) fn(); },
  "cal-nav": ds => {
    const [y, m] = state.histMonth.split("-").map(Number);
    const nd = new Date(y, m - 1 + Number(ds.d), 1);
    state.histMonth = nd.getFullYear() + "-" + pad2(nd.getMonth() + 1);
    render();
  },
  "cal-day": ds => { state.histSel = ds.d; render(); },
  "hist-seg": ds => { state.histSeg = ds.k; render(); },
  "wt-range": ds => { state.wtRange = ds.r; render(); },
  "export": exportData,
  "wipe": () => confirmDialog("<b>すべてのデータを削除します。</b>この操作は取り消せません。先にエクスポートでのバックアップをおすすめします。", "すべて削除", () => {
    store.keys().forEach(k => store.del(k));
    store.set("seed-done", true); /* 削除後に同梱データを自動再投入しない */
    master = DEFAULT_MASTER.map(m => ({ ...m }));
    settings = null;
    closeModal();
    render();
  }),
  "onboard-save": () => {
    const w = parseFloat($("#ob-weight").value);
    if (!(w > 20 && w < 300)) { toast("体重を入力してください(20〜300kg)"); return; }
    settings = { weight: Math.round(w * 10) / 10, goal: $("#ob-goal").value, daysPerWeek: Number($("#ob-days").value), beginner: "auto" };
    saveSettings();
    saveMaster();
    closeModal();
    toast("設定を保存しました。さっそく始めましょう!");
    render();
  },
};

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-action]");
  if (!t) return;
  const fn = actions[t.dataset.action];
  if (fn) { ev.preventDefault(); fn(t.dataset, t, ev); }
});

document.addEventListener("change", ev => {
  const t = ev.target.closest("[data-change]");
  if (!t) return;
  const k = t.dataset.change;
  if (k === "rec-date") { const v = t.value || today(); state.recordDate = v > today() ? today() : v; render(); }
  else if (k === "hist-ex") { state.histExId = t.value; render(); }
  else if (k === "diet-goal") { settings.goal = t.value; saveSettings(); render(); }
  else if (k === "set-weight") { const v = parseFloat(t.value); if (v > 20 && v < 300) { settings.weight = Math.round(v * 10) / 10; saveSettings(); toast("保存しました"); } }
  else if (k === "set-goal") { settings.goal = t.value; saveSettings(); toast("保存しました"); }
  else if (k === "set-days") { settings.daysPerWeek = Number(t.value); saveSettings(); toast("保存しました"); }
  else if (k === "set-beginner") { settings.beginner = t.value; saveSettings(); render(); }
  else if (k === "import") { const f = t.files && t.files[0]; if (f) importData(f); t.value = ""; }
});

document.addEventListener("input", ev => {
  if (!state.sheet) return;
  const t1 = ev.target.closest("[data-input='sheet']");
  if (t1) { state.sheet.e[t1.dataset.f] = t1.value === "" ? "" : Number(t1.value); return; }
  const t2 = ev.target.closest("[data-input='setrow']");
  if (t2 && state.sheet.e.setDetails) {
    const row = state.sheet.e.setDetails[Number(t2.dataset.i)];
    if (row) row[t2.dataset.f] = t2.value === "" ? "" : Number(t2.value);
    return;
  }
  const t3 = ev.target.closest("[data-input='sheet-memo']");
  if (t3) state.sheet.memo = t3.value;
});

/* overlay背景タップで閉じる(確認ダイアログとオンボーディング以外) */
document.addEventListener("click", ev => {
  if (ev.target.matches("[data-overlay]") && !pendingConfirm && settings) closeModal();
});

/* ---------------- init ---------------- */
/* アプリアイコン: ヘッダーロゴ + このHTMLが単体で開かれた場合のファビコン/ホーム画面アイコン */
$("#app-logo").src = APP_ICON;
[["icon", APP_ICON], ["apple-touch-icon", APP_ICON]].forEach(x => {
  const l = document.createElement("link");
  l.rel = x[0]; l.href = x[1];
  document.head.appendChild(l);
});
store.onLost(() => { $("#storage-banner").hidden = false; }); /* 実行中にlocalStorageへ書けなくなった場合も警告 */
if (!store.isPersistent()) $("#storage-banner").hidden = false;
if (settings && !store.get("exercise-master")) saveMaster();
render();
</script>
